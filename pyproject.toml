[project]
name = "multimodal-rag"
version = "0.1.0"
description = "RAG over PDF tables, charts and figures using NVIDIA vision models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pypdfium2>=4.30",   # self-contained wheel; no poppler system dependency
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
